<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Wizard Shootout</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧙</text></svg>">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', monospace;
    }
    /* Phones: viewport-fit=cover hands the whole screen to the page, so the
       container keeps the game clear of the notch, the rounded corners and
       the home indicator itself. Fixed insets (not 100vh) also track the
       visible height while mobile browser toolbars come and go. */
    #game-container {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
    }
    /* Rotate prompt: a phone held upright shrinks the 1024x700 canvas to a
       sliver. Mirrors TOUCH_CONFIG.rotateQuery in src/config.js (the game
       pauses a running round on the same query). */
    #rotate-prompt {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #1a1a2e;
      color: #e8e8f0;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      text-align: center;
      font-size: 18px;
      padding: 24px;
    }
    #rotate-prompt .phone {
      width: 46px;
      height: 80px;
      border: 4px solid #7d5fd1;
      border-radius: 10px;
      animation: rotate-hint 2s ease-in-out infinite;
    }
    @keyframes rotate-hint {
      0%, 20% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }
    @media (orientation: portrait) and (pointer: coarse) and (max-width: 599px) {
      #rotate-prompt { display: flex; }
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <div id="rotate-prompt" role="alert"><div class="phone"></div><p>Turn your phone sideways to play</p></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
