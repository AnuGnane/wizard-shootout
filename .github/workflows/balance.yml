name: Balance

# Plays every ordered class pair bot vs bot (npm run balance) and uploads the
# win-rate report as an artifact. Run by hand: Actions -> Balance -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds per ordered class pair
        default: '200'
      seed:
        description: Random seed
        default: '1'

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: npx playwright install --with-deps chromium

      - name: Play the balance rounds
        timeout-minutes: 30
        env:
          ROUNDS: ${{ inputs.rounds }}
          SEED: ${{ inputs.seed }}
        run: npm run balance -- --rounds "$ROUNDS" --seed "$SEED"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: docs/balance.md
          if-no-files-found: error
